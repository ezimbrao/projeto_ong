<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turmas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <script src="/assets/shared.js"></script>
</head>
<body class="min-h-screen flex flex-col text-gray-800 dark:text-white transition duration-300 bg-gradient-to-r from-pink-300 via-pink-200 to-orange-300 dark:from-[#0f172a] dark:via-[#172554] dark:to-[#020617]">
  <header class="bg-white shadow-md dark:bg-gray-800 w-full">
    <nav class="container mx-auto flex justify-between items-center px-6 py-4">
      <h1 class="text-xl font-bold text-pink-600 dark:text-pink-400">📋 Sistema da ONG</h1>
      <button class="md:hidden text-2xl" onclick="toggleMenu()">☰</button>
      <ul class="hidden md:flex items-center space-x-6 font-medium">
        <li><a href="/pages/home/index.html" class="hover:text-pink-500">Início</a></li>
        <li><a href="/pages/alunos/cadastro.html" class="hover:text-pink-500">Cadastro</a></li>
        <li><a href="/pages/turmas/index.html" class="px-4 py-2 rounded-full bg-pink-100 text-pink-600 dark:bg-pink-900 dark:text-pink-300">Turmas</a></li>
        <li><a href="/pages/alunos/editar.html" class="hover:text-pink-500">Editar alunos</a></li>
        <li><a id="btnLogin" href="/pages/auth/login.html" class="px-4 py-2 rounded-full border border-pink-500 text-pink-500 hover:bg-pink-500 hover:text-white transition dark:border-pink-500 dark:text-pink-500 dark:hover:bg-pink-500 dark:hover:text-white">Login</a></li>
        <li><button onclick="toggleDarkMode()" class="px-3 py-1 rounded-md bg-gray-100 dark:bg-gray-700"><span class="theme-icon">🌙</span></button></li>
      </ul>
    </nav>
    <div id="mobile-menu" class="hidden md:hidden bg-white dark:bg-gray-800">
      <ul class="flex flex-col gap-3 p-4 text-center">
        <li><a href="/pages/home/index.html">Início</a></li>
        <li><a href="/pages/alunos/cadastro.html">Cadastro</a></li>
        <li><a href="/pages/turmas/index.html" class="block py-2 bg-pink-100 text-pink-600 rounded-full">Turmas</a></li>
        <li><a href="/pages/alunos/editar.html">Editar alunos</a></li>
        <li><a id="btnLoginMobile" href="/pages/auth/login.html" class="block py-2 border border-pink-500 text-pink-500 rounded-full hover:bg-pink-500 hover:text-white">Login</a></li>
        <li><button onclick="toggleDarkMode()" class="w-full py-2 bg-gray-100 dark:bg-gray-700 rounded-md"><span class="theme-icon">🌙</span></button></li>
      </ul>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center px-6 py-16">
    <div class="w-full max-w-5xl">
      <h2 class="text-3xl font-bold text-center text-pink-600 dark:text-pink-400 mb-10">Selecione a turma</h2>
      <div id="turmasGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
    </div>
  </main>

  <footer class="bg-gray-200 dark:bg-gray-800 text-center py-4">
    <p>&copy; 2026 Sistema da ONG</p>
  </footer>

  <div id="logoutModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 dark:bg-opacity-70">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-8 max-w-sm w-full mx-4">
      <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-4 text-center">Fazer Logout?</h2>
      <p class="text-gray-600 dark:text-gray-400 text-center mb-8">Você tem certeza que deseja sair? Terá que fazer login novamente.</p>
      <div class="flex gap-4">
        <button id="logoutCancel" class="flex-1 px-4 py-3 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-white font-semibold hover:bg-gray-300 dark:hover:bg-gray-600 transition">Cancelar</button>
        <button id="logoutConfirm" class="flex-1 px-4 py-3 rounded-lg bg-pink-600 text-white font-semibold hover:bg-pink-700 transition">Logout</button>
      </div>
    </div>
  </div>

  <script>
    const grid = document.getElementById('turmasGrid');

    async function loadTurmas() {
      const classes = await readJson('/classes');

      grid.innerHTML = classes.map((classe) => `
        <a href="/pages/turmas/attendance.html?classId=${classe.id}&className=${encodeURIComponent(classe.name)}" class="block cursor-pointer bg-white dark:bg-gray-800 p-6 rounded-2xl shadow-md text-center hover:scale-105 transition">
          <h3 class="text-xl font-bold">${classe.name}</h3>
          <p class="text-sm text-gray-500 dark:text-gray-300 mt-2">Abrir chamada da turma</p>
        </a>
      `).join('');
    }

    loadTurmas();
  </script>
</body>
</html>
