<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Musicar-te - Cadastro</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>

  <style>
    html {
      scrollbar-gutter: stable;
    }
  </style>

  <script>
    if (
      localStorage.getItem('theme') === 'dark' ||
      (!('theme' in localStorage) &&
      window.matchMedia('(prefers-color-scheme: dark)').matches)
    ) {
      document.documentElement.classList.add('dark');
    }

    function toggleDarkMode() {
      document.documentElement.classList.toggle('dark');

      const icons = document.querySelectorAll('.theme-icon');

      if (document.documentElement.classList.contains('dark')) {
        localStorage.setItem('theme', 'dark');
        icons.forEach(icon => icon.textContent = '☀️');
      } else {
        localStorage.setItem('theme', 'light');
        icons.forEach(icon => icon.textContent = '🌙');
      }
    }

    function toggleMenu() {
      document.getElementById('mobile-menu').classList.toggle('hidden');
    }

    window.addEventListener('DOMContentLoaded', () => {
      const icons = document.querySelectorAll('.theme-icon');
      const dark = document.documentElement.classList.contains('dark');

      icons.forEach(icon => {
        icon.textContent = dark ? '☀️' : '🌙';
      });
    });
  </script>
  <script>

document
  .getElementById("formCadastro")
  .addEventListener("submit", function(e) {

    e.preventDefault();

    const nome =
      document.getElementById("nome").value;

    // salva o nome
    localStorage.setItem("usuario", nome);

    // redireciona
    window.location.href = "index.html";

  });

</script>
</head>

<body class="min-h-screen flex flex-col text-gray-800 dark:text-white transition duration-300
bg-gradient-to-r from-pink-300 via-pink-200 to-orange-300
dark:from-[#0f172a] dark:via-[#172554] dark:to-[#020617]">

  <!-- HEADER -->
  <header class="bg-white shadow-md dark:bg-gray-800 w-full">
    <nav class="container mx-auto flex justify-between items-center px-6 py-4">

      <div class="flex items-center gap-3">
  <img src="img/logoMusicarte.png" alt="Logo Musicar-te" class="h-16">
      </div>

      <button class="md:hidden text-2xl" onclick="toggleMenu()">☰</button>

      <!-- MENU -->
      <ul class="hidden md:flex items-center space-x-6 font-medium">

        <li><a href="index.html" class="hover:text-pink-500">Início</a></li>

        <li><a href="cadastro.html" class="hover:text-pink-500">Cadastro</a></li>

        <li><a href="chamada.html" class="hover:text-pink-500">Chamada</a></li>

        <li><a href="alunos.html" class="hover:text-pink-500">Alunos</a></li>



        <!-- ATIVO -->
        <li>
          <a href="cadastre.html"
            class="px-4 py-2 rounded-full bg-pink-100 text-pink-600 dark:bg-pink-900 dark:text-pink-300">
            Cadastre-se
          </a>
        </li>

        <li>
          <button onclick="toggleDarkMode()"
            class="px-3 py-1 rounded-md bg-gray-100 dark:bg-gray-700">
            <span class="theme-icon">🌙</span>
          </button>
        </li>

      </ul>
    </nav>

    <!-- MENU MOBILE -->
    <div id="mobile-menu" class="md:hidden hidden bg-white dark:bg-gray-900">
      <ul class="flex flex-col space-y-3 p-4 text-center">

        <li><a href="index.html">Início</a></li>
        <li><a href="cadastro.html">Cadastro</a></li>
        <li><a href="chamada.html">Chamada</a></li>
        <li><a href="alunos.html">Alunos</a></li>

        <li>
          <a href="cadastre.html"
            class="bg-pink-100 text-pink-600 rounded-full py-2">
            Cadastre-se
          </a>
        </li>

        <li>
          <button onclick="toggleDarkMode()"
            class="w-full py-2 bg-gray-100 dark:bg-gray-700 rounded-md">
            <span class="theme-icon">🌙</span>
          </button>
        </li>

      </ul>
    </div>
  </header>

  <!-- CADASTRO -->
  <main class="flex-grow flex items-center justify-center px-6 py-16">

    <div class="w-full max-w-md bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-lg">

      <h2 class="text-3xl font-bold text-center text-pink-600 dark:text-pink-400 mb-8">
        Criar Conta
      </h2>

      <form id="formCadastro" class="space-y-6">

        <!-- Nome -->
        <div>
          <label class="block mb-2 font-medium">
            Nome
          </label>

          <input
            type="text"
            id="nome"
            required
            class="w-full p-3 rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-900
            focus:outline-none focus:ring-2 focus:ring-pink-500">
        </div>

        <!-- Email -->
        <div>
          <label class="block mb-2 font-medium">
            E-mail
          </label>

          <input
            type="email"
            id="email"
            required
            class="w-full p-3 rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-900
            focus:outline-none focus:ring-2 focus:ring-pink-500">
        </div>

        <!-- Senha -->
        <div>
          <label class="block mb-2 font-medium">
            Senha
          </label>

          <input
            type="password"
            id="senha"
            required
            class="w-full p-3 rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-900
            focus:outline-none focus:ring-2 focus:ring-pink-500">
        </div>

        <!-- Confirmar senha -->
        <div>
          <label class="block mb-2 font-medium">
            Confirmar senha
          </label>

          <input
            type="password"
            id="confirmarSenha"
            required
            class="w-full p-3 rounded-lg border border-gray-300 dark:border-gray-700 dark:bg-gray-900
            focus:outline-none focus:ring-2 focus:ring-pink-500">
        </div>

        <!-- Botão -->
        <button
          type="submit"
          class="w-full bg-pink-600 text-white py-3 rounded-lg font-semibold
          hover:bg-pink-700 transition duration-300">

          Criar Conta

        </button>

      </form>

      <p class="text-center mt-6 text-sm">
        Já possui conta?

        <a id="btnLogin" href="login.html"
          class="text-pink-600 dark:text-pink-400 font-semibold hover:underline">

          Entrar

        </a>
      </p>

    </div>

  </main>

  <!-- FOOTER -->
  <footer class="bg-gray-200 text-gray-700 text-center py-4 dark:bg-gray-800 dark:text-gray-300">
    <p>&copy; 2026 Musicar-te. Todos os direitos reservados.</p>
  </footer>

  <!-- MODAL DE LOGOUT PERSONALIZADO -->
  <div id="logoutModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 dark:bg-opacity-70">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl p-8 max-w-sm w-full mx-4">
      <h2 class="text-2xl font-bold text-gray-800 dark:text-white mb-4 text-center">Fazer Logout?</h2>
      <p class="text-gray-600 dark:text-gray-400 text-center mb-8">
        Você tem certeza que deseja sair? Terá que fazer login novamente.
      </p>
      <div class="flex gap-4">
        <button id="logoutCancel" class="flex-1 px-4 py-3 rounded-lg bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-white font-semibold hover:bg-gray-300 dark:hover:bg-gray-600 transition">
          Cancelar
        </button>
        <button id="logoutConfirm" class="flex-1 px-4 py-3 rounded-lg bg-pink-600 text-white font-semibold hover:bg-pink-700 transition">
          Logout
        </button>
      </div>
    </div>
  </div>

  <!-- SCRIPT -->
  <script>
    const formCadastro = document.getElementById('formCadastro');

    formCadastro.addEventListener('submit', function(e) {
      e.preventDefault();

      const nome = document.getElementById('nome').value;
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      const confirmarSenha = document.getElementById('confirmarSenha').value;

      if (senha !== confirmarSenha) {
        alert("As senhas não coincidem.");
        return;
      }

      const usuario = {
        nome,
        email,
        senha
      };

      localStorage.setItem('usuarioCadastrado', JSON.stringify(usuario));
      localStorage.setItem('usuario', nome);

      alert("Conta criada com sucesso!");

      window.location.href = "index.html";
    });
  </script>

  <!-- SCRIPT PARA MOSTRAR NOME DO USUÁRIO LOGADO -->
  <script>
    function mostrarModalLogout(callback) {
      const modal = document.getElementById('logoutModal');
      const btnConfirm = document.getElementById('logoutConfirm');
      const btnCancel = document.getElementById('logoutCancel');
      modal.classList.remove('hidden');
      const handleConfirm = () => {
        modal.classList.add('hidden');
        btnConfirm.removeEventListener('click', handleConfirm);
        btnCancel.removeEventListener('click', handleCancel);
        callback(true);
      };
      const handleCancel = () => {
        modal.classList.add('hidden');
        btnConfirm.removeEventListener('click', handleConfirm);
        btnCancel.removeEventListener('click', handleCancel);
        callback(false);
      };
      btnConfirm.addEventListener('click', handleConfirm);
      btnCancel.addEventListener('click', handleCancel);
    }
    document.addEventListener('DOMContentLoaded', function() {
      const usuario = localStorage.getItem("usuario");
      const btnLogin = document.getElementById("btnLogin");

      if (usuario && btnLogin) {
        const inicial = usuario.charAt(0).toUpperCase();
        
        btnLogin.textContent = inicial;
        btnLogin.href = "#";
        btnLogin.classList.add('cursor-pointer');
        
        btnLogin.addEventListener('click', function(e) {
          e.preventDefault();
          mostrarModalLogout(function(confirmed) {
            if (confirmed) {
              localStorage.removeItem("usuario");
              window.location.href = "index.html";
            }
          });
        });
      }
    });
  </script>

</body>
</html>
